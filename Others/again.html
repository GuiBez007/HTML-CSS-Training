<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>

    
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            .headfoot {
                text-align: center;
                border: solid yellow;
                height: 10%;
            }

            body {
                border: solid red;
                height: 100vh;
            }

            main {
                display: flex;
                border: solid blue;
                height: 80%;
            }
            .div {
                border: solid green;
                margin: 5px;
                height: 50%;
            }

            aside {
                display: flex;
                flex-direction: column;
                width: 100%;
                border: solid red;
            }
            #spliter {
                display: flex;
            }
            #spliter > div {
                width: 100%;
                height: 100%;
                border: solid green;
            }

            
        </style>
        <title>Document</title>
    </head>

    <body>
        <header class="headfoot">
            <h1>Best Animes Ever</h1>
        </header>

        <main>
            <aside>
                <div class="div"></div>
                <div class="div"></div>
            </aside>
                
            <aside>
                <div class="div"></div>
                <div id="spliter" class="div">
                    <div></div>
                    <div></div>
                </div>
            </aside>
       </main> 

       <footer class="headfoot">
            <p>
                Made by <span>Guilherme Bezerra</span>
            </p>
       </footer>

    </body>
</html>
