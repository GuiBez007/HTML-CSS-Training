<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Styles/mobile-first-style.css">
    <link rel="stylesheet" href="Styles/media-querries-styles.css">
</head>

<body>
    <main>
        <div id="tela-branca">
            <h1>Login</h1>
            <p>
                Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.
            </p>

            <form action="" method="get">
                <div id="div-email" class="form-input-div">
                    <input type="email" name="email" id="iemail" required placeholder=" Seu email">
                </div>

                <div id="div-senha" class="form-input-div">
                    <input type="password" name="senha" id="isenha" required placeholder=" Sua senha">
                </div>

                <input id="btn-entrar" class="form-input-button" type="submit" value="Entrar">
                <input id="btn-esqueci-senha" class="form-input-button" type="button" value="Esqueci a Senha">

            </form>

        </div>


    </main>
</body>
</html>
