<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            h1 {
                text-align: center;
            }
            body {
                margin: auto;
                text-align: center;
                background-image: url('Imagens/wallpaper004.jpg');
            }
            .image {
                display: inline-block;
                height: 200px;
                width: 30%;
                border: 3px solid black;
                border-radius: 7px;
                background-color: bisque;
            }
            #img1 {
                background-color: aqua;   
            }
            #img2 {
                background-image: linear-gradient(to bottom, yellow, red, blue);   
            }
            #img3 {
                background-image: url(Imagens/wallpaper001.jpg);   
            }
        </style>
    </head>

    <body>
        <h1>Background Tests</h1>
        <div class="image" id="img1"></div>
        <div class="image" id="img2"></div>
        <div class="image" id="img3"></div>

    </body>
</html>
