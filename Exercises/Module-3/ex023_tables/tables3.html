<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            table {
                border-collapse: collapse;
            }
            td {
                text-align: center;
                border: 1px solid;
                height: 50px;
                width: 50px;
            }
        </style>
    </head>

    <body>
        <table>
            <tbody>
            <tr>
                <td colspan="2">A</td>
                <td rowspan="3">B</td>
                <!-- <td>C</td> -->
            </tr>
            <tr>
                <td rowspan="2">D</td>
                <td>E</td>
                <!-- <td>F</td> -->
            </tr>
            <tr>
                <!-- <td>G</td> -->
                <td>H</td>
                <!-- <td>I</td> -->
            </tr>
            </tbody>
        </table>
        
    </body>
</html>
