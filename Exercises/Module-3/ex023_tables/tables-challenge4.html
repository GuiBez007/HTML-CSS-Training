<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            border-collapse: collapse;
            font-size: 1em;
            width: 400px;
        }
        tr {
            /* text-align: center; */
        }
        td, th {
            border: 1px solid black;
            padding: 3px;
        }
        td {
            text-align: center;
        }
        .diferent-row {
            background-color: rgba(0, 0, 0, 0.444);
            color: white;
        }

        .cgroup {
            /*    INÚTIL    */
            text-align: center;
            /*    INÚTIL    */

            /* background-color: aqua; */
            /* TESTE */
        }
        
    </style>
</head>

<body>
    <table>
        <colgroup>
            <col class="carea">
            <col class="cdisciplinas">
            <col class="cgroup" span="3">
        </colgroup>

        <thead>
            <tr class="diferent-row">
                <th scope="col" rowspan="2">Área</th>
                <th scope="col" rowspan="2">Disciplinas</th>
                <th scope="colgroup" colspan="2">Notas</th>
                <th scope="col" rowspan="2">Média</th>
            </tr>
            <tr class="diferent-row">
                <th scope="col">Nota 1</th>
                <th scope="col">Nota 2</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th scope="rowgroup" rowspan="4">Exatas</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr scope="row" class="diferent-row" style="text-align: left;">
                <th colspan="4">Média de Exatas</th>
                <td>0.0</td>
            </tr>

            <tr>
                <th scope="rowgroup" rowspan="2">Humanas</th>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr scope="row" class="diferent-row" style="text-align: left;">
                <th colspan="4">Média de Humanas</th>
                <td>0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
