<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #principal {
            border: solid blue;
            height: 400px;

            display: grid;
            grid-template: repeat(3, 1fr) / repeat(4, 1fr);

            grid-auto-flow: row;
            grid-auto-rows: 1fr;
            grid-auto-columns: 1fr;

            place-items: ;
            place-content: center center;
            gap: 10px;
        }
        #principal div {
            

        }

        #caixa1 {
            background-color: red;
            grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: -1;
        }
        #caixa2 {
            background-color: green;
            grid-row-start: 2;
            grid-row-end: -1;
            grid-column-start: 1;
            grid-column-end: 3;
        }
        #caixa3 {
            background-color: blue;
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 3;
            grid-column-end: 5;
        }
    </style>
</head>
<body>
    <div id="principal">
        <div id="caixa1"></div>
        <div id="caixa2"></div>
        <div id="caixa3"></div>
    </div>
</body>
</html>
