<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Twitter Site</title>
        <style>
            * {
                padding: 0;
                border: 0;
                box-sizing: border-box;
            }
        
            a {
                display: block;
                text-decoration: none;
                border: solid red; 
                text-align: center;
                color: black;
                font-size: 2em; 
                width: 600px;
                transition-duration: 0.5s;
            }
            a:hover {
                text-decoration: underline;
                background-color: rgba(0, 0, 255, 0.829);
                color: white;
            }

            div {
                width: 80vw;
            }
        </style>
    </head>

    <body>
        <div>
            <img src="../../Images/tela-twitter.jpg" alt="Imagem Twitter">
            <a href="https://www.youtube.com/" target="_blank">ACESSE JÁ</a>
        </div>

    </body>
</html>
